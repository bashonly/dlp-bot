name: Update ejs (for yt-dlp)
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-ejs
  cancel-in-progress: false

jobs:
  output_variables:
    name: Output variables
    runs-on: ubuntu-latest
    outputs:
      default_head_branch: ${{ steps.variables.outputs.default_head_branch }}
      default_head_owner: ${{ steps.variables.outputs.default_head_owner }}
      matrix: ${{ steps.variables.outputs.matrix }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Output variables
        id: variables
        run: python -m bot tools variables ejs

  update_ejs:
    name: Update ejs (${{ matrix.repo }})
    needs: [output_variables]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.output_variables.outputs.matrix) }}
    env:
      HEAD_BRANCH: ${{ vars.UPDATE_EJS_BRANCH || needs.output_variables.outputs.default_head_branch }}
      HEAD_OWNER: ${{ vars.HEAD_OWNER || needs.output_variables.outputs.default_head_owner }}

    steps:
      - name: Checkout bot repo (${{ github.repository }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: service-bot
          persist-credentials: false

      - name: Checkout working repo (${{ format('{0}/{1}', env.HEAD_OWNER, matrix.repo) }})
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: ${{ format('{0}/{1}', env.HEAD_OWNER, matrix.repo) }}
          path: ${{ matrix.repo }}
          fetch-depth: 0
          persist-credentials: true  # Needed to git-push
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure git user
        env:
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME || 'dlp-bot' }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL || 'bot@yt-dlp.org' }}
        run: |
          git config --global user.name "${GIT_USER_NAME}"
          git config --global user.email "${GIT_USER_EMAIL}"

      - name: Configure SSH signing key
        if: ${{ vars.SSH_SIGNING_KEY_ID }}
        env:
          SSH_AUTH_SOCK: /tmp/ssh-auth-sock-${{ github.run_id }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_SIGNING_KEY_ID: ${{ vars.SSH_SIGNING_KEY_ID }}
        run: |
          ssh-agent -a "${SSH_AUTH_SOCK}"
          printf -- '%s\n' "${SSH_PRIVATE_KEY}" | ssh-add -
          git config --global user.signingkey "${SSH_SIGNING_KEY_ID}"
          git config --global gpg.format ssh
          git config --global commit.gpgsign true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      - name: Install Python requirements
        run: |
          python -m pip install -U --require-hashes -r "service-bot/requirements/pip.txt"
          python -m pip install -U --require-hashes -r "service-bot/requirements/update.txt"
          python -m pip install -U --require-hashes -r "service-bot/requirements/update-dependencies.txt"

      - name: Run bot update ejs
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          SSH_AUTH_SOCK: /tmp/ssh-auth-sock-${{ github.run_id }}
          WORKING_REPO: ${{ matrix.repo }}
        run: |
          cd service-bot
          python -m bot update ejs \
            --pr \
            --verbose \
            --git-protocol https \
            --head "${HEAD_OWNER}:${HEAD_BRANCH}" \
            --overwrite-pr \
            -- \
            ../"${WORKING_REPO}"
